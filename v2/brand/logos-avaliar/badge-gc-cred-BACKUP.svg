<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 484 404" width="100%" height="100%">
  <title>GC Cred — selo</title>
  <desc>Selo circular: anel pincelado, cartao, GC CRED e slogan, paleta Noite Forte</desc>

  <!-- Sem fundo — transparente sobre a superfície do card -->

  <!-- Anel pincelado — arco quase completo com abertura no canto superior esquerdo -->
  <!-- circunferência = 2π×148 ≈ 929.9; vão de 55.1 centralizado às 10h via rotate -->
  <circle cx="242" cy="202" r="148" fill="none" stroke="#D4FF3F" stroke-width="6"
          stroke-linecap="round" stroke-dasharray="874.9 55.1"
          transform="rotate(-139.4 242 202)" />
  <!-- Reforço do traço na base (acúmulo do pincel), das 72° às 137° -->
  <circle cx="242" cy="202" r="148" fill="none" stroke="#D4FF3F" stroke-width="9"
          stroke-linecap="round" opacity="0.85" stroke-dasharray="167.4 929.9"
          transform="rotate(72 242 202)" />

  <!-- Cartão — corpo lima -->
  <rect x="197" y="138" width="90" height="58" rx="8" fill="#D4FF3F" />
  <!-- Tarja do cartão (negativo) -->
  <rect x="197" y="152" width="90" height="8" fill="#1A1033" />
  <!-- Chip (negativo) -->
  <rect x="262" y="170" width="13" height="13" rx="2" fill="#1A1033" />

  <!-- Wordmark -->
  <text x="242" y="248" text-anchor="middle"
        font-family="'Sora', system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="40" font-weight="800" letter-spacing="3" fill="#D4FF3F">GC CRED</text>

  <!-- Slogan -->
  <text x="242" y="270" text-anchor="middle"
        font-family="'Sora', system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="10.5" font-weight="700" letter-spacing="2.5" fill="#D4FF3F" opacity="0.9">CHAMOU, PASSOU, TÁ NA CONTA!</text>
</svg>
