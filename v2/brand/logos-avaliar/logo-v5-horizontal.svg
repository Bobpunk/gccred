    <rect x="-68" y="-44" width="136" height="86" rx="10" fill="#100828" stroke="#D4FF3F" stroke-width="3"/>
    <rect x="-68" y="-30" width="136" height="12" fill="#D4FF3F" opacity="0.07"/>
    <rect x="-52" y="-6" width="22" height="17" rx="3" fill="none" stroke="#D4FF3F" stroke-width="2.2"/>
